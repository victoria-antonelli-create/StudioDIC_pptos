<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDIO DIC | Nuevo Presupuesto</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;color:#111;font-family:Arial,Helvetica,sans-serif}
.topbar{height:62px;background:#ededec;border-bottom:1px solid #d0d0d0;display:flex;align-items:center;justify-content:center;position:relative}
.topbar h1{font-size:18px;letter-spacing:5px;font-weight:500;margin:0}
.topbar button{position:absolute;border:0;background:none;font-size:28px;cursor:pointer}
.menu{left:22px}.settings{right:22px}
.app{max-width:1000px;margin:auto;padding:20px}
.sheet{background:white;padding:28px 30px 32px;box-shadow:0 2px 8px #bbb}
.header{display:grid;grid-template-columns:42% 58%;align-items:start;min-height:255px}
.logo{width:255px;height:255px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.header-info{text-align:right;padding:12px 8px 0 0;font-size:15px;line-height:1.35}
.header-info .group{margin-bottom:28px}
.header-info .label{display:block;margin-bottom:4px}
.header-info .value{font-weight:600}
.header-info .number{font-size:23px;font-weight:700;margin-top:8px}
.client{margin-top:12px}
.client-row{display:grid;grid-template-columns:76px 1fr;align-items:end;gap:8px;margin-bottom:18px}
.client-row label{font-size:15px;font-weight:700}
.client-row input{width:100%;border:0;border-bottom:2px solid #222;padding:4px 3px 5px;font-size:15px;outline:none;background:transparent}
.works-wrap{display:grid;grid-template-columns:54px minmax(0,1fr);margin-top:25px}
.vertical-title{border:1px solid #222;border-right:0;background:#f0f0ef;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:14px;font-weight:700}
.table-area{min-width:0}
table{width:100%;border-collapse:collapse;table-layout:fixed;background:white}
th,td{border:1px solid #222}
th{height:43px;background:#f0f0ef;text-align:center;padding:8px;font-size:14px}
th:nth-child(1),td:nth-child(1){width:30%}
th:nth-child(2),td:nth-child(2){width:35%}
th:nth-child(3),td:nth-child(3){width:35%}
td{height:58px;padding:0}
.work-input{width:100%;height:100%;border:0;resize:none;padding:7px;font-family:Arial,Helvetica,sans-serif;font-size:12px;outline:none;background:transparent}
.action-col{display:none!important}
.add{width:100%;margin-top:8px;border:0;background:#e5e3e1;padding:10px;font-weight:700;font-size:14px;cursor:pointer}
.add span{font-size:22px;margin-right:10px}
.bottom{border:1px solid #222;margin-top:25px;padding:20px 22px 15px}
.price{display:flex;align-items:center;gap:8px}
.price label{font-size:19px;font-weight:700;white-space:nowrap}
.price input{border:0;border-bottom:2px solid #222;flex:0 1 380px;padding:4px 4px 5px;font-size:17px;outline:none}
.notes{margin-top:23px}
.notes label{display:block;font-size:14px;font-weight:700;margin-bottom:9px}
.notes textarea{width:100%;height:85px;border:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,#222 26px);resize:none;padding:0 2px;font-family:Arial,sans-serif;font-size:14px;line-height:26px;outline:none}
.actions{display:grid;grid-template-columns:1fr 1.2fr 1.4fr;gap:14px;margin-top:16px}
.actions button{border:0;border-radius:5px;background:#e5e3e1;padding:14px;font-weight:700;font-size:15px;cursor:pointer}
.actions .pdf{background:#111;color:white}
@page{size:A4 portrait;margin:0}
@media(max-width:700px){
 .app{padding:10px}
 .sheet{padding:18px 14px 20px}
 .header{grid-template-columns:42% 58%;min-height:160px}
 .logo{width:100%;height:auto;aspect-ratio:1/1}
 .header-info{font-size:10px;padding-top:3px}
 .header-info .group{margin-bottom:13px}
 .header-info .number{font-size:16px}
 .client-row{grid-template-columns:68px 1fr;margin-bottom:12px}
 .client-row label{font-size:12px}
 .works-wrap{grid-template-columns:34px 1fr;margin-top:16px}
 .vertical-title{font-size:10px}
 th{font-size:10px;height:34px;padding:5px}
 td{height:52px}
 .work-input{font-size:10px}
 .bottom{margin-top:16px;padding:13px}
 .price label{font-size:14px}
 .price input{font-size:13px}
 .notes{margin-top:15px}
 .notes label{font-size:11px}
 .notes textarea{height:68px;line-height:21px;background:repeating-linear-gradient(to bottom,transparent 0,transparent 20px,#222 21px)}
 .actions{grid-template-columns:1fr;gap:7px}
}
@media print{
 body{background:white}
 .topbar,.actions,.add,.delete,.settings,.menu{display:none!important}
 .app{max-width:none;padding:0}
 .sheet{box-shadow:none;padding:12mm 13mm 10mm}
 .header{min-height:68mm}
 .logo{width:62mm;height:62mm}
 .header-info{font-size:10pt}
 .header-info .group{margin-bottom:7mm}
 .header-info .number{font-size:17pt}
 .client{margin-top:3mm}
 .client-row{margin-bottom:4mm}
 .client-row label{font-size:10pt}
 .client-row input{font-size:10pt}
 .works-wrap{margin-top:6mm}
 th{font-size:9pt;height:11mm}
 td{height:17mm}
 .work-input{font-size:8.5pt}
 .bottom{margin-top:6mm;padding:5mm 6mm 4mm}
 .price label{font-size:12pt}
 .price input{font-size:11pt}
 .notes{margin-top:5mm}
 .notes textarea{height:25mm}
}
</style>
</head>

<script>
const KEY="studio_dic_presupuesto_numero";
let numero=parseInt(localStorage.getItem(KEY)||"293",10);
if(!numero||numero<293)numero=293;
document.getElementById("numeroVista").textContent="#"+numero;

const d=new Date();
document.getElementById("fechaTexto").textContent=
String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();

function addRow(data={trabajo:"",descripcion:"",observaciones:""}){
 const tr=document.createElement("tr");
 tr.innerHTML=
 `<td><textarea class="work-input">${esc(data.trabajo)}</textarea></td>
  <td><textarea class="work-input">${esc(data.descripcion)}</textarea></td>
  <td><textarea class="work-input">${esc(data.observaciones)}</textarea></td>`;
 document.getElementById("items").appendChild(tr);
}
function esc(v){
 return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
for(let i=0;i<5;i++)addRow();

function limpiar(){
 if(!confirm("¿Querés limpiar el presupuesto?"))return;
 ["cliente","telefono","direccion","precio","observaciones"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("items").innerHTML="";
 for(let i=0;i<5;i++)addRow();
}
function generarPDF(){
 const cliente=document.getElementById("cliente").value.trim()||"Sin cliente";
 document.title="Presupuesto "+String(numero).padStart(3,"0")+" - "+cliente;
 localStorage.setItem(KEY,String(numero+1));
 window.print();
 numero++;
 document.getElementById("numeroVista").textContent="#"+numero;
}
</script>
